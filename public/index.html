<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="/css/settings.css" />
  </head>
  <body>
    <main class="page">
      <section class="settings-card" aria-labelledby="settings-title">
        <header class="settings-header">
          <h1 id="settings-title">Settings</h1>
          <p class="settings-subtitle">Update your profile and application preferences.</p>
        </header>

        <form id="settings-form" class="settings-form" novalidate>
          <fieldset class="form-section">
            <legend>Profile</legend>

            <div class="form-field">
              <label for="displayName">Display name</label>
              <input
                id="displayName"
                name="displayName"
                type="text"
                autocomplete="name"
                required
                aria-describedby="displayName-error"
              />
              <p id="displayName-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                aria-describedby="email-error"
              />
              <p id="email-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label for="username">Username</label>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                aria-describedby="username-error username-hint"
              />
              <p id="username-hint" class="field-hint">3–20 characters. Letters, numbers, and underscores only.</p>
              <p id="username-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label for="bio">Bio <span class="optional">(optional)</span></label>
              <textarea
                id="bio"
                name="bio"
                rows="4"
                maxlength="500"
                aria-describedby="bio-error bio-count"
              ></textarea>
              <div class="field-meta">
                <p id="bio-error" class="field-error" role="alert"></p>
                <p id="bio-count" class="field-hint" aria-live="polite">0 / 500</p>
              </div>
            </div>
          </fieldset>

          <fieldset class="form-section">
            <legend>Preferences</legend>

            <div class="form-field">
              <label for="theme">Theme</label>
              <select id="theme" name="theme" aria-describedby="theme-error">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="system" selected>System</option>
              </select>
              <p id="theme-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label for="language">Language</label>
              <select id="language" name="language" aria-describedby="language-error">
                <option value="en" selected>English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
              </select>
              <p id="language-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field">
              <label for="timezone">Timezone</label>
              <select id="timezone" name="timezone" required aria-describedby="timezone-error">
                <option value="">Select a timezone</option>
                <option value="UTC">UTC</option>
                <option value="America/New_York">America/New_York</option>
                <option value="America/Chicago">America/Chicago</option>
                <option value="America/Denver">America/Denver</option>
                <option value="America/Los_Angeles">America/Los_Angeles</option>
                <option value="Europe/London">Europe/London</option>
                <option value="Europe/Paris">Europe/Paris</option>
                <option value="Asia/Tokyo">Asia/Tokyo</option>
              </select>
              <p id="timezone-error" class="field-error" role="alert"></p>
            </div>

            <div class="form-field form-field--checkbox">
              <input id="notifications" name="notifications" type="checkbox" />
              <label for="notifications">Email me about product updates</label>
            </div>
          </fieldset>

          <div id="form-status" class="form-status" role="status" aria-live="polite"></div>

          <div class="form-actions">
            <button type="reset" class="btn btn-secondary">Reset</button>
            <button type="submit" class="btn btn-primary">Save settings</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/js/validation.js"></script>
    <script src="/js/settings-form.js"></script>
  </body>
</html>
